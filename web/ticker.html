<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticker — Research Desk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ED5A24'/><text x='16' y='22' font-size='15' font-weight='800' font-family='Arial' fill='white' text-anchor='middle'>FD</text></svg>">
<link rel="stylesheet" href="/assets/desk.css">
<script src="/assets/desk.js" defer></script>
<style>
body{padding-bottom:50px}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
.right{display:flex;gap:10px;align-items:center;white-space:nowrap}
input#go{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);
  border-radius:8px;padding:7px 12px;font-size:13px;width:150px;text-transform:uppercase;outline:none}
input#go:focus{border-color:var(--accent)}

main{max-width:1280px;margin:0 auto;padding:18px 22px}
.hero{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.hero .sym{font-size:26px;font-weight:800;letter-spacing:.03em}
.hero .co{font-size:14px;color:var(--ink2)}
.hero .badge{font-size:10px;color:var(--muted);border:1px solid var(--line2);
  border-radius:5px;padding:2px 7px;letter-spacing:.06em}
.hero .px{font-size:26px;font-weight:800}
.hero .chg{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 340px;gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.grid.solo{grid-template-columns:1fr 340px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.panel-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.panel-h .s{font-size:10.5px;color:var(--muted)}
.panel-b{padding:13px 14px}

/* chart controls */
.fsbtn{background:var(--panel2);color:var(--ink2);border:1px solid var(--line2);
  border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer}
.fsbtn:hover{color:var(--accent);border-color:var(--accent)}
.panel.fs{position:fixed;inset:14px;z-index:60;margin:0;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7)}
.seg{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:2px}
.seg button{background:none;border:none;color:var(--ink2);font-size:10.5px;padding:4px 9px;
  border-radius:5px;cursor:pointer;letter-spacing:.05em}
.seg button.on{background:var(--line2);color:var(--ink)}
.seg button:hover{color:var(--accent)}
#chartwrap{position:relative}
#tip{position:absolute;pointer-events:none;display:none;background:var(--panel2);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-size:11px;z-index:5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#tip .d{color:var(--muted);font-size:10px}
#tip .v{font-weight:700;font-size:13px}
.rangeret{font-size:12px;font-weight:700}

.range{margin:10px 0 4px}
.range .cap{font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.range .track{height:5px;background:var(--line);border-radius:3px;position:relative}
.range .mark{position:absolute;top:-3.5px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg)}
.range .lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;background:var(--line)}
.st{background:var(--panel);padding:9px 12px}
.st .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.st .v{font-size:14px;font-weight:700;margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
tbody tr:last-child td{border-bottom:none}

.news-item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.news-item:last-child{border-bottom:none}
.news-item .t{color:var(--muted);font-size:10.5px;white-space:nowrap;min-width:72px}
.news-item .pub{color:var(--muted);font-size:10.5px}
.news-item a{color:var(--ink);font-size:12.5px}
.news-item a:hover{color:var(--accent)}

.an-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0}
.an-row .k{color:var(--ink2)}
.gbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.gbar i{display:block;height:100%}
.desc{font-size:12px;color:var(--ink2);line-height:1.6}
.loading{padding:60px;text-align:center;color:var(--muted)}
.poscard{background:linear-gradient(135deg,#1a1410,#12161d);border:1px solid #3a2a1a}

/* ---- financials panel ---- */
.fin-tabs{margin:0;border-radius:0;border-left:none;border-right:none;border-top:none;
  background:var(--panel);padding:4px 8px;flex-wrap:wrap}
.finwrap{overflow-x:auto}
.fintab td.grp,.fintab th.grp{text-align:left}
.fintab td:first-child{color:var(--ink2)}
.fintab tr.sect td{color:var(--ink);font-weight:700;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;padding-top:13px;border-bottom:1px solid var(--line2)}
.fintab td.tot,.fintab tr.tot td{font-weight:700;color:var(--ink)}
.fin-note{font-size:10.5px;color:var(--muted);padding:9px 14px;line-height:1.5}
.fintab tr.chgrow td{font-size:10px;font-style:italic;padding-top:0;padding-bottom:6px;color:var(--muted)}
.fintab tr.chgrow td.pos{color:var(--pos);opacity:.85}
.fintab tr.chgrow td.neg{color:var(--neg);opacity:.85}
.fintab tr.chgrow td:first-child{font-weight:400}
.fintab tr.haschg td{border-bottom:none;padding-bottom:2px}
.peertab th{cursor:pointer;user-select:none}
.peertab th:hover{color:var(--accent)}
.dcfgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:900px){.dcfgrid{grid-template-columns:1fr}}
.dcf-as{margin-bottom:11px}
.dcf-as .l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:3px}
.dcf-as .l b{color:var(--ink);font-size:12px}
.dcf-as .hint{font-size:9.5px;color:var(--muted);margin-top:2px}
.dcf-as input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.dcfout{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:14px;height:fit-content}
.dcfout .big{font-size:24px;font-weight:800;margin:2px 0}
.dcfout .vs{font-size:13px;font-weight:700;margin-bottom:10px}
.dcfout .an-row{font-size:11.5px}
</style>
</head>
<body>
<header>
  <div class="brand">RESEARCH <span>DESK</span></div>
  <nav></nav>
  <div class="right">
    <input id="go" placeholder="Ticker… ⏎">
  </div>
</header>
<main id="app"><div class="loading">Loading research view…</div></main>

<script>
"use strict";
const P = new URLSearchParams(location.search);
const SYM = (P.get("symbol")||"AAPL").toUpperCase();
const REG = (P.get("region")||"us").toLowerCase();
document.getElementById("go").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.value.trim())
    location.href="/t?symbol="+e.target.value.trim().toUpperCase()+(REG==="in"?"&region=in":"");});

const F=(x,dp=2)=>x==null||isNaN(x)?"—":Number(x).toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const CUR = REG==="in" ? "₹" : "$";
const money=(x,dp=2)=>x==null||isNaN(x)?"—":(x<0?"−"+CUR:CUR)+F(Math.abs(x),dp);
const usd=money;
const pct=(x,dp=2)=>x==null||isNaN(x)?"—":(x>=0?"+":"−")+Math.abs(x).toFixed(dp)+"%";
const cls=x=>x==null?"dim":(x>=0?"pos":"neg");
const big=x=>{if(x==null)return "—";if(Math.abs(x)>=1e12)return "$"+(x/1e12).toFixed(2)+"T";
  if(Math.abs(x)>=1e9)return "$"+(x/1e9).toFixed(1)+"B";if(Math.abs(x)>=1e6)return "$"+(x/1e6).toFixed(0)+"M";return usd(x,0);};
const xr=(x,dp=1)=>x==null||isNaN(x)?"—":Number(x).toFixed(dp)+"x";
const pc=(x,dp=1)=>x==null||isNaN(x)?"—":(x*100).toFixed(dp)+"%";
const ago=iso=>{if(!iso)return "";const s=(Date.now()-new Date(iso.replace(" ","T")+(iso.includes("Z")?"":"Z")))/1e3;
  if(s<3600)return Math.max(1,Math.round(s/60))+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d";};

/* ============ CHART v3: native-pixel, fullscreen, intraday, premium ============ */
let HIST=[];               // oldest -> newest {date, price, o,h,l,v}
let INTRA={};              // {"1D":[...], "5D":[...]} (India only)
let mode="candles", range="1Y", isFS=false;
const DAYRANGES={"1M":22,"3M":66,"6M":132,"1Y":252,"3Y":756,"5Y":1260,"MAX":1e9};

function rangeList(){
  const base=Object.keys(DAYRANGES);
  return (INTRA["1D"]?.length||INTRA["5D"]?.length) ? ["1D","5D",...base] : base;
}
function sliced(){
  if(range==="1D"||range==="5D") return INTRA[range]||[];
  const n=DAYRANGES[range]; return n>=HIST.length?HIST:HIST.slice(HIST.length-n);
}
/* Aggregate daily bars to weekly/monthly so CANDLES stays candles on long
   ranges (the Koyfin/TradingView behaviour) instead of falling back to a line. */
function resampleOHLC(pts,bucket){
  const out=[]; let cur=null, key="";
  for(const p of pts){
    const k = bucket==="M" ? (p.date||"").slice(0,7)
      : String(Math.floor((Date.parse(p.date)/864e5+4)/7));   // ISO-ish week bucket
    if(k!==key){ if(cur)out.push(cur); key=k;
      cur={date:p.date,o:p.o??p.price,h:p.h??p.price,l:p.l??p.price,price:p.price,v:p.v||0};
    }else{
      cur.h=Math.max(cur.h,p.h??p.price); cur.l=Math.min(cur.l,p.l??p.price);
      cur.price=p.price; cur.v+=(p.v||0); cur.date=p.date;    // stamp = period end
    }
  }
  if(cur)out.push(cur);
  return out;
}
function seriesFor(pts,intra){
  if(mode!=="drawdown") return pts.map(p=>({d:p.date,v:p.price}));
  if(!intra&&HIST.length){
    // running peak over FULL loaded history, not just the visible window —
    // a 1Y view starts below zero when the peak is older than the window.
    let peak=-Infinity; const dd={};
    for(const p of HIST){peak=Math.max(peak,p.price); dd[p.date]=(p.price/peak-1)*100;}
    return pts.map(p=>({d:p.date,v:dd[p.date]??0}));
  }
  let peak=-Infinity;
  return pts.map(p=>{peak=Math.max(peak,p.price);return {d:p.date,v:(p.price/peak-1)*100};});
}
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function xLabel(d){
  if(range==="1D") return d.slice(11,16);
  if(range==="5D") return d.slice(8,10)+" · "+d.slice(11,16);
  if(range==="1M"||range==="3M") return d.slice(5,10);
  if(range==="6M"||range==="1Y") return MONS[+d.slice(5,7)-1]+" "+d.slice(2,4);
  if(range==="3Y"||range==="5Y") return MONS[+d.slice(5,7)-1]+" "+d.slice(2,4);
  return d.slice(0,4);
}
function niceStep(span){
  const raw=span/4, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,2.5,5,10]) if(raw<=m*mag) return m*mag;
  return 10*mag;
}
function sma(arr,n){
  const out=new Array(arr.length).fill(null); let sum=0;
  for(let i=0;i<arr.length;i++){
    sum+=arr[i]; if(i>=n)sum-=arr[i-n];
    if(i>=n-1)out[i]=sum/n;
  }
  return out;
}
function drawChart(){
  const el=document.getElementById("chart");
  if(!el)return;
  let pts=sliced();
  if(pts.length<2){el.innerHTML='<div class="dim" style="padding:30px">No data for this range.</div>';return;}
  const intra=(range==="1D"||range==="5D");
  let barNote="";
  if(mode==="candles"&&!intra&&pts.length>320){
    pts=resampleOHLC(pts,"W"); barNote="weekly bars";
    if(pts.length>320){pts=resampleOHLC(sliced(),"M"); barNote="monthly bars";}
  }
  const S=seriesFor(pts,intra);
  const showVol = mode!=="drawdown" && pts.some(p=>p.v);
  // native pixels: crisp type at every width
  const w=Math.max(560, el.clientWidth||860);
  const h=isFS ? Math.max(380, window.innerHeight-230) : 300;
  const L=8, R=62, T=16, B=28;
  const vh=showVol?Math.round((h-T-B)*0.16):0;           // volume strip
  const pT=T, pB=h-B-(showVol?vh+10:0);                  // price plot bottom
  const vals=S.map(s=>s.v);
  const useCandles = mode==="candles" && !pts.some(p=>p.o==null);
  let min,max;
  if(useCandles){
    min=Math.min(...pts.map(p=>p.l??p.price)); max=Math.max(...pts.map(p=>p.h??p.price));
  }else{min=Math.min(...vals);max=Math.max(...vals);}
  if(mode==="drawdown"){max=0;}
  const pad=(max-min)*0.06||1; min-=pad; if(mode!=="drawdown")max+=pad;
  const plotW=w-L-R;
  const X=i=>L+(i/(S.length-1))*plotW, Y=v=>pT+(pB-pT)*(1-(v-min)/(max-min));
  const lastV=vals[vals.length-1];
  const up = mode!=="drawdown" ? lastV>=vals[0] : lastV>=-0.001;
  const col = mode==="drawdown" ? "var(--neg)" : (up?"var(--pos)":"var(--neg)");

  // y grid
  let gy=""; const step=niceStep(max-min);
  for(let v=Math.ceil(min/step)*step; v<=max; v+=step){
    const y=Y(v);
    gy+=`<line x1="${L}" y1="${y}" x2="${w-R}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${w-R+8}" y="${y+4}" fill="var(--muted)" font-size="11">${mode!=="drawdown"?F(v,step<1?2:step<10?1:0):v.toFixed(0)+"%"}</text>`;
  }
  // x ticks — consecutive duplicate labels dropped (no more "2024 2024")
  let gx=""; const xstep=Math.max(1,Math.floor(S.length/(isFS?9:6)));
  let lastLbl="";
  for(let i=0;i<S.length;i+=xstep){
    const x=X(i); if(x<44||x>w-R-30)continue;
    const lbl=xLabel(S[i].d); if(lbl===lastLbl)continue; lastLbl=lbl;
    gx+=`<text x="${x}" y="${h-8}" fill="var(--muted)" font-size="10.5" text-anchor="middle">${lbl}</text>`;
  }

  // marks: candles or line
  let marks="";
  const cw=plotW/S.length;
  if(useCandles && cw>=2.2 && mode==="candles"){
    // body fills ~72% of its slot (capped) so sparse ranges read as real
    // candles, not skinny bars floating in space; wick scales with the body
    const bw=Math.max(1.6,Math.min(30,cw*0.72));
    const wickW=Math.max(1,Math.min(2.4,bw*0.12));
    for(let i=0;i<pts.length;i++){
      const p=pts[i]; if(p.o==null)continue;
      const close=p.price;
      const x=X(i), o=Y(p.o), c=Y(close),
            hi=Y(p.h??Math.max(p.o,close)), lo=Y(p.l??Math.min(p.o,close));
      const bull=close>=p.o, cc=bull?"var(--pos)":"var(--neg)";
      const top=Math.min(o,c), bh=Math.max(1.2,Math.abs(o-c));
      marks+=`<line x1="${x}" y1="${hi}" x2="${x}" y2="${lo}" stroke="${cc}" stroke-width="${wickW}" opacity="0.9"/>
        <rect x="${x-bw/2}" y="${top}" width="${bw}" height="${bh}" fill="${cc}" fill-opacity="0.95" rx="${bw>6?1.5:0.5}"/>`;
    }
    marks=`<g class="anim-rise">${marks}</g>`;
  }else{
    const line=S.map((s,i)=>`${X(i).toFixed(1)},${Y(s.v).toFixed(1)}`).join(" ");
    const base = mode==="drawdown" ? Y(0) : pB;
    marks=`<polygon class="anim-fade" points="${X(0)},${base} ${line} ${X(S.length-1)},${base}" fill="url(#fade)"/>
      <polyline class="drawline" pathLength="1" points="${line}" fill="none" stroke="${col}" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>`;
  }

  // moving averages — computed on DAILY closes, joined to visible bars by
  // date (index-joining breaks once long ranges resample to weekly/monthly)
  let mas="", legend="";
  if(!intra && mode!=="drawdown" && HIST.length>50){
    const closes=HIST.map(p=>p.price);
    for(const [n,mcol,name] of [[50,"var(--amber)","MA50"],[200,"var(--cyan)","MA200"]]){
      if(HIST.length<n+5)continue;
      const m=sma(closes,n), byDate={};
      for(let i=0;i<HIST.length;i++) if(m[i]!=null) byDate[HIST[i].date]=m[i];
      const seg=[];
      for(let i=0;i<pts.length;i++){
        const v=byDate[pts[i].date];
        if(v!=null&&v>=min&&v<=max)seg.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
      }
      if(seg.length>2){
        mas+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${mcol}" stroke-width="1.3" opacity="0.75"/>`;
        legend+=`<span style="color:${mcol};font-size:10px;margin-left:10px">— ${name}</span>`;
      }
    }
  }

  // volume strip
  let vol="";
  if(showVol){
    const vmax=Math.max(...pts.map(p=>p.v||0))||1;
    const vT=pB+8, vB2=h-B;
    const vw=Math.max(1,Math.min(30,cw*0.72));
    for(let i=0;i<pts.length;i++){
      const p=pts[i]; if(!p.v)continue;
      const vhgt=Math.max(1,(p.v/vmax)*(vB2-vT));
      const cc=(p.o!=null&&p.price<p.o)?"var(--neg)":"var(--pos)";
      vol+=`<rect x="${X(i)-vw/2}" y="${vB2-vhgt}" width="${vw}" height="${vhgt}" fill="${cc}" opacity="0.35"/>`;
    }
    vol=`<g class="anim-fade">${vol}<text x="${L+2}" y="${vT+9}" fill="var(--muted)" font-size="9" letter-spacing=".08em">VOLUME</text></g>`;
  }

  // last-value pill
  const ly=Math.max(pT+9,Math.min(pB-9,Y(lastV)));
  const pill=`<g class="anim-fade"><rect x="${w-R+2}" y="${ly-10}" width="${R-6}" height="20" rx="5" fill="${col}"/>
    <text x="${w-R+2+(R-6)/2}" y="${ly+4}" fill="var(--bg)" font-size="11" font-weight="700" text-anchor="middle">${mode!=="drawdown"?F(lastV,lastV<100?2:lastV<10000?1:0):lastV.toFixed(1)+"%"}</text></g>`;

  el.innerHTML=`<svg id="csvg" width="${w}" height="${h}" style="display:block">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity="${mode==="drawdown"?0.02:0.20}"/>
      <stop offset="100%" stop-color="${col}" stop-opacity="${mode==="drawdown"?0.25:0.01}"/>
    </linearGradient></defs>
    ${gy}${gx}${vol}${marks}${mas}${pill}
    <line id="xh" x1="0" y1="${pT}" x2="0" y2="${h-B}" stroke="var(--ink2)" stroke-width="0.8" stroke-dasharray="3 3" style="display:none"/>
    <circle id="xdot" r="4" fill="${col}" stroke="var(--bg)" stroke-width="1.6" style="display:none"/>
  </svg>`;
  const ret = mode!=="drawdown" ? (vals[vals.length-1]/vals[0]-1)*100 : null;
  const maxdd = mode!=="drawdown" ? null : Math.min(...vals);
  const lbl=document.getElementById("chartret");
  if(lbl) lbl.innerHTML = (mode!=="drawdown"
    ? `<span class="rangeret mono ${cls(ret)}">${pct(ret)}</span> <span class="dim">over ${range}${barNote?" · "+barNote:""}</span>`
    : `<span class="rangeret mono neg">${maxdd.toFixed(1)}%</span> <span class="dim">deepest in ${range} · % below the running peak of all loaded history</span>`)+legend;

  const svg=document.getElementById("csvg"), tip=document.getElementById("tip");
  svg.addEventListener("mousemove",ev=>{
    const r=svg.getBoundingClientRect();
    let i=Math.round(((ev.clientX-r.left)-L)/plotW*(S.length-1));
    i=Math.max(0,Math.min(S.length-1,i));
    const x=X(i),y=Y(S[i].v);
    const xh=document.getElementById("xh"),xd=document.getElementById("xdot");
    xh.setAttribute("x1",x);xh.setAttribute("x2",x);xh.style.display="block";
    xd.setAttribute("cx",x);xd.setAttribute("cy",y);xd.style.display="block";
    tip.style.display="block";
    const p=pts[i];
    tip.innerHTML = mode==="drawdown"
      ? `<div class="d">${S[i].d}</div><div class="v mono">${S[i].v.toFixed(1)}%</div>`
      : (p.o!=null
        ? `<div class="d">${S[i].d}</div><div class="v mono">${money(p.price)}</div>
           <div class="d mono">O ${F(p.o)} · H ${F(p.h)} · L ${F(p.l)}</div>
           ${p.v!=null?`<div class="d mono">Vol ${F(p.v,0)}</div>`:""}`
        : `<div class="d">${S[i].d}</div><div class="v mono">${money(S[i].v)}</div>`);
    const wrap=document.getElementById("chartwrap").getBoundingClientRect();
    let tx=ev.clientX-wrap.left+14; if(tx>wrap.width-150)tx-=170;
    tx=Math.max(4,tx);
    let ty=ev.clientY-wrap.top-16;
    ty=Math.max(4,Math.min(wrap.height-86,ty));   // keep the tip inside the panel
    tip.style.left=tx+"px"; tip.style.top=ty+"px";
  });
  svg.addEventListener("mouseleave",()=>{tip.style.display="none";
    document.getElementById("xh").style.display="none";
    document.getElementById("xdot").style.display="none";});
}

function chartPanel(){
  return `<section class="panel" id="chartpanel">

function bindChart(){
  renderRangeSeg();
  document.getElementById("rangeseg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    range=b.dataset.r; renderRangeSeg(); drawChart();});
  document.querySelectorAll("#modeseg button").forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;
    document.querySelectorAll("#modeseg button").forEach(x=>x.classList.toggle("on",x===b));
    drawChart();});
  document.getElementById("fsbtn").onclick=toggleFS;
  window.addEventListener("resize",()=>drawChart());
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&isFS)toggleFS();});
  drawChart();
}
function toggleFS(){
  isFS=!isFS;
  document.getElementById("chartpanel").classList.toggle("fs",isFS);
  document.body.style.overflow=isFS?"hidden":"";
  document.getElementById("fsbtn").textContent=isFS?"✕":"⛶";
  drawChart();
}

function rangeBar(cap,lo,hi,px,loD,hiD){
  if(lo==null||hi==null||hi<=lo)return "";
  const posn=Math.min(100,Math.max(0,(px-lo)/(hi-lo)*100));
  return `<div class="range"><div class="cap">${cap}</div>
    <div class="track"><span class="mark" style="left:calc(${posn.toFixed(1)}% - 6px)"></span></div>
    <div class="lbl"><span>${F(lo)}${loD?" · "+loD:""}</span><span>${F(hi)}${hiD?" · "+hiD:""}</span></div></div>`;
}
function st(l,v,k){return `<div class="st"><div class="l">${l}</div><div class="v mono ${k||""}">${v}</div></div>`;}

async function load(){
  const r=await fetch("/api/ticker?symbol="+SYM+"&region="+REG);

  const app=document.getElementById("app");
  if(d.error){app.innerHTML=`<div class="loading">${d.error}</div>`;return;}
  document.title=SYM+" — Research Desk";
  HIST=[...(d.history||[])].reverse();
  INTRA=d.intraday||{};

}

function renderIN(d,app){
  const q=d.quote, m=d.meta||{};

    const isFut = ("expiry" in h) && ("side" in h);
    if(isFut){
      const sign=(h.side||"Buy").toLowerCase()==="buy"?1:-1;
      const pnl=(h.ltp!=null&&h.avg!=null&&h.qty!=null)?(h.ltp-h.avg)*h.qty*sign:null;
      posCards+=`<section class="panel poscard"><div class="panel-h"><h2>${k}</h2><span class="s">${h.expiry||""}</span></div>
        <div class="panel-b">
        <div class="an-row"><span class="k">${h.side} qty</span><span class="mono">${F(h.qty,0)}</span></div>
        <div class="an-row"><span class="k">Avg</span><span class="mono">${money(h.avg)}</span></div>
        <div class="an-row"><span class="k">Mark</span><span class="mono">${money(h.ltp)}</span></div>
        <div class="an-row"><span class="k">MTM</span><span class="mono ${cls(pnl)}">${pnl==null?"—":(pnl>=0?"+":"")+money(pnl,0)}</span></div>
        </div></section>`;
    }else{
      const val=px*h.qty, cost=h.avg*h.qty, pnl=val-cost;
      posCards+=`<section class="panel poscard"><div class="panel-h"><h2>Held — ${k}</h2></div>
        <div class="panel-b">
        <div class="an-row"><span class="k">Qty</span><span class="mono">${F(h.qty,0)}</span></div>
        <div class="an-row"><span class="k">Avg cost</span><span class="mono">${money(h.avg)}</span></div>
        <div class="an-row"><span class="k">Value</span><span class="mono">${money(val,0)}</span></div>
        <div class="an-row"><span class="k">Open P&L</span><span class="mono ${cls(pnl)}">${(pnl>=0?"+":"")+money(pnl,0)} (${pct(pnl/cost*100)})</span></div>
        </div></section>`;
    }
  }
  // futures book: live bid/ask/OI on the contract itself
  let futBook="";
  for(const fq of (d.futures_quotes||[])){
    futBook+=`<section class="panel"><div class="panel-h"><h2>Futures book</h2><span class="s">${fq.expiry}</span></div>
      <div class="panel-b">
      <div class="an-row"><span class="k">LTP</span><span class="mono" style="font-weight:700">${money(fq.ltp)}</span></div>
      <div class="an-row"><span class="k">Bid</span><span class="mono">${money(fq.bid)} × ${F(fq.bid_qty,0)}</span></div>
      <div class="an-row"><span class="k">Ask</span><span class="mono">${money(fq.offer)} × ${F(fq.offer_qty,0)}</span></div>
      <div class="an-row"><span class="k">Open interest</span><span class="mono">${F(fq.oi,0)}</span></div>
      <div class="an-row"><span class="k">Volume</span><span class="mono">${F(fq.ttq,0)}</span></div>
      <div class="an-row"><span class="k">Prev close</span><span class="mono">${money(fq.prev)}</span></div>
      </div></section>`;
  }
  posCards += futBook;
  app.innerHTML=`
  <div class="hero">
    <span class="sym">${SYM}</span><span class="co">${m.company||""}</span>
    <span class="badge">${q.exch||m.exch||""}</span>
    ${m.nse_symbol?`<span class="badge">NSE: ${m.nse_symbol}</span>`:""}
    <span style="flex:1"></span>
    <span class="px mono">${money(px)}</span>
    <span class="chg mono ${cls(q.day_pct)}">${pct(q.day_pct)}</span>
  </div>
  <div class="sub">${m.isin?"ISIN "+m.isin+" · ":""}bid ${money(q.bid)} × ${F(q.bid_qty,0)} · offer ${money(q.offer)} × ${F(q.offer_qty,0)} · vol ${F(q.ttq,0)} · as of ${d.ts}</div>
  <div class="grid">
    <div>
      ${chartPanel()}
      <section class="panel">
        <div class="panel-h"><h2>Session</h2></div>
        <div class="stats">
          ${st("Open",money(q.open))}${st("High",money(q.high))}${st("Low",money(q.low))}
          ${st("Prev close",money(q.prev))}${st("Volume",F(q.ttq,0))}

async function loadInfund(){
  let d;
  try{ const r=await fetch("/api/infund?symbol="+SYM); d=await r.json(); }
  catch(e){ d={error:"fetch failed"}; }
  const qEl=document.getElementById("if-q"), aEl=document.getElementById("if-ann"), sEl=document.getElementById("if-sh");
  if(!qEl) return;
  if(d.error){
    qEl.innerHTML=aEl.innerHTML=sEl.innerHTML=`<div class="desc">${d.error}</div>`;
    return;
  }
  const qs=d.quarters||[];
  if(qs.length){
    const MON={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
    const flavor=qs[0].flavor||"", qlabel=s=>{
      const p=s.split("-"); const m=MON[(p[1]||"").toUpperCase()], y=+p[2];
      if(m==null||!y) return s;
      const q=m>=3?Math.floor((m-3)/3)+1:4, fy=(m>=3?y+1:y)%100;
      return "Q"+q+" FY"+fy;};
    qEl.innerHTML=`<table class="mini"><thead><tr><th>Quarter</th><th>Revenue</th><th>PBT</th><th>PAT</th><th>EPS</th></tr></thead><tbody>`+
      qs.map(x=>{
        const yoy=qs.find(o=>o!==x&&o.quarter_ended.slice(0,6)===x.quarter_ended.slice(0,6)&&+o.quarter_ended.slice(-4)===+x.quarter_ended.slice(-4)-1);
        const g=(yoy&&yoy.revenue&&x.revenue!=null)?((x.revenue-yoy.revenue)/Math.abs(yoy.revenue)*100):null;
        return `<tr><td>${qlabel(x.quarter_ended)}<span class="s"> ${x.quarter_ended}</span></td>
          <td class="mono">${x.revenue==null?"—":F(x.revenue,0)}${g==null?"":` <span class="${g>=0?"pos":"neg"}" style="font-size:10px">${pct(g)}</span>`}</td>
          <td class="mono ${cls(x.pbt)}">${x.pbt==null?"—":F(x.pbt,0)}</td>
          <td class="mono ${cls(x.pat)}">${x.pat==null?"—":F(x.pat,0)}</td>
          <td class="mono ${cls(x.eps)}">${x.eps==null?"—":x.eps}</td></tr>`;}).join("")+
      `</tbody></table><div class="desc" style="margin-top:6px">${flavor}, as filed with NSE (revenue % is YoY same quarter, when in range). Rounding read from each filing.</div>`;
  }else qEl.innerHTML=`<div class="desc">No integrated filings found (feed covers results filed after Dec 2024).</div>`;
  const sh=d.shareholding||[];
  sEl.innerHTML = sh.length
    ? `<table class="mini"><thead><tr><th>As of</th><th>Promoter</th><th>Public</th></tr></thead><tbody>`+
      sh.map(x=>`<tr><td>${x.date}</td><td class="mono">${x.promoter==null?"—":x.promoter.toFixed(2)+"%"}</td><td class="mono">${x.public==null?"—":x.public.toFixed(2)+"%"}</td></tr>`).join("")+
      `</tbody></table>`
    : `<div class="desc">No shareholding data.</div>`;
  const ann=d.announcements||[];
  aEl.innerHTML = ann.length
    ? ann.map(x=>`<div class="an-row" style="align-items:baseline;gap:10px">
        <span class="s mono" style="white-space:nowrap">${x.date}</span>
        <span style="flex:1;font-size:12px">${x.pdf?`<a href="${x.pdf}" target="_blank" style="color:var(--ink);text-decoration:none">${x.desc||"Filing"}</a>`:(x.desc||"Filing")}
          <span class="s"> — ${x.text||""}</span></span></div>`).join("")
    : `<div class="desc">No filings in the last 90 days.</div>`;
}

// ---- DCF workspace (client-side, seeded from actuals) ----
let DCFA=null;
function dcfSeeds(){
  const inc=(FIN.inc_a||[]).slice().reverse(), cf=(FIN.cf_a||[]).slice().reverse(),
        bs=(FIN.bs_a||[]).slice().reverse();
  const li=inc[inc.length-1]||{}, lc=cf[cf.length-1]||{}, lb=bs[bs.length-1]||{};
  const clamp=(v,a,b,d)=>(v==null||isNaN(v))?d:Math.min(b,Math.max(a,v));
  let cagr=8;
  // seed off the last ~3 growth intervals so a distressed base year (e.g. a
  // COVID-era FY) does not inflate the default into fantasy
  const win=inc.slice(-4);
  if(win.length>=2&&win[0].revenue>0)
    cagr=(Math.pow(li.revenue/win[0].revenue,1/(win.length-1))-1)*100;
  return {
    g: clamp(Math.round(cagr),-5,30,8),
    em: clamp(Math.round(li.revenue?li.ebitda/li.revenue*100:20),1,70,20),
    da: clamp(Math.round(li.revenue?li.depreciationAndAmortization/li.revenue*100:4),0,25,4),
    cx: clamp(Math.round(li.revenue?Math.abs(lc.capitalExpenditure||0)/li.revenue*100:4),0,30,4),
    tax: clamp(Math.round(li.incomeBeforeTax>0?li.incomeTaxExpense/li.incomeBeforeTax*100:21),5,40,21),
    wacc: 9, tg: 2.5,
    rev0: li.revenue||0, netDebt: lb.netDebt??((lb.totalDebt||0)-(lb.cashAndCashEquivalents||0)),
    shares: li.weightedAverageShsOutDil||li.weightedAverageShsOut||null, fy: li.fiscalYear
  };
}
function dcfCompute(){
  const a=DCFA; if(!a||!a.rev0||!a.shares) return null;
  if(a.wacc<=a.tg+0.5) return {err:"Discount rate must sit above terminal growth."};
  let rev=a.rev0, pv=0, fcfN=0;
  for(let t=1;t<=5;t++){
    rev*=(1+a.g/100);
    const ebitda=rev*a.em/100, da=rev*a.da/100, ebit=ebitda-da;
    const nopat=ebit*(1-a.tax/100), fcf=nopat+da-rev*a.cx/100;
    pv+=fcf/Math.pow(1+a.wacc/100,t);
    if(t===5) fcfN=fcf;
  }
  const tv=fcfN*(1+a.tg/100)/((a.wacc-a.tg)/100), tvPV=tv/Math.pow(1+a.wacc/100,5);
  const ev=pv+tvPV, eq=ev-(a.netDebt||0), ps=eq/a.shares;
  return {ev,eq,ps,tvShare:ev?tvPV/ev*100:null};
}

      oninput="DCFA.${k}=+this.value;document.getElementById('dcfv-${k}').textContent=this.value+'%';dcfOut()">

    <div class="an-row"><span class="k">Enterprise value</span><span class="mono">${big(r.ev)}</span></div>
    <div class="an-row"><span class="k">Less net debt</span><span class="mono">${big(DCFA.netDebt)}</span></div>

}
function renderFin(){
  const el=document.getElementById("finbody"); if(!el||!FIN) return;
  document.querySelectorAll("#fin-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===FS.mode));
  document.querySelectorAll("#fin-period button").forEach(b=>b.classList.toggle("on",b.dataset.p===FS.period));
  document.querySelectorAll("#fin-unit button").forEach(b=>b.classList.toggle("on",b.dataset.u===FS.unit));
  const cb=document.getElementById("fin-chgbtn"); if(cb) cb.classList.toggle("on",FS.chg);
  if(FIN.error){ el.innerHTML=`<div class="fin-note">${FIN.error}</div>`; return; }
  const m=FS.mode;
  el.innerHTML = m==="inc"||m==="bs"||m==="cf" ? finStmtHTML(m)
    : m==="ratios" ? finRatiosHTML()
    : m==="seg" ? finSegHTML()
    : m==="est" ? finEstHTML()
    : m==="peers" ? finPeersHTML()
    : m==="div" ? finDivHTML()
    : finDcfHTML();
}
load();
</script>
</body>
